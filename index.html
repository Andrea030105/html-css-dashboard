<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/media-queries.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Dashboard</title>
</head>

<body>
    <header>
        <div class="container-fulid">
            <div class="row gx-0">
                <div class="col-12">
                    <div class="bg-nav d-flex align-items-center justify-content-center">
                        <nav class="navbar bg-body-tertiary w-100">
                            <div class="container-fluid">
                                <img class="d-none d-lg-block" src="./img/logo.svg" alt="logo">
                                <img class="d-lg-none logo-mobile" src="./img/mobile-logo.png" alt="mobile-logo">
                                <form class="d-flex w-form" role="search">
                                    <input class="form-control me-2" type="search" placeholder="Search"
                                        aria-label="Search" />
                                </form>
                                <div class="icon-nav d-flex align-items-center">
                                    <div class="d-none d-lg-block">
                                        <i class="fa-solid fa-list mx-1"></i>
                                        <i class="fa-solid fa-circle-question mx-1"></i>
                                        <i class="fa-solid fa-ellipsis-vertical mx-1"></i>
                                    </div>
                                    <div class="dropdown">
                                        <button class="btn" type="button" data-bs-toggle="dropdown"
                                            aria-expanded="false">
                                            <i class="fa-solid fa-bell cl-bell"></i>
                                        </button>
                                        <ul class="dropdown-menu">
                                            <li><a class="dropdown-item" href="#">Action</a></li>
                                            <li><a class="dropdown-item" href="#">Another action</a></li>
                                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="container-main d-flex">
            <aside class="text-light fw-bold">
                <div class="container-fluid">
                    <div class="row flex-column">
                        <div class="col-6 w-100">
                            <div class="top-col py-3 fs-5">
                                <div class="d-flex align-items-center my-3">
                                    <i class="fa-solid fa-house"></i>
                                    <span class="mx-2 d-none d-lg-block">Home</span>
                                </div>
                                <div class="d-flex align-items-center my-3">
                                    <i class="fa-solid fa-chart-simple"></i>
                                    <span class="mx-2 d-none d-lg-block">Stats</span>
                                </div>
                                <div class="d-flex align-items-center my-3">
                                    <i class="fa-solid fa-signal"></i>
                                    <span class="mx-2 d-none d-lg-block">Signal</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-6 w-100">
                            <div class="bottom-col d-flex align-items-end pb-3 fs-5">
                                <div class="d-flex align-items-center">
                                    <i class="fa-solid fa-gear"></i>
                                    <span class="mx-2 d-none d-lg-block">Admin </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
            <div class="conatiner-topbar-main">
                <div class="top-bar">

                </div>
                <div class="main-content">

                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
